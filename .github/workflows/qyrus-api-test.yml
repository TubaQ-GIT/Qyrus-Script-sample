name: Qyrus Enterprise API Test Execution

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-enterprise-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone Qyrus CLI
        run: |
          git clone https://github.com/QQyrus/node-cli qyrus-cli
          cd qyrus-cli
          npm install

      - name: Execute Enterprise API Tests
        env:
          QYRUS_API_KEY: ${{ secrets.QYRUS_API_KEY }}
        run: |
          cd qyrus-cli
          node ./index.cjs apiEnterprise \
            --executionType "functional" \
            --apiKey "$QYRUS_API_KEY" \
            --teamName "Qyrus Demos" \
            --projectName "Demo API" \
            --suiteName "Suite-2"
