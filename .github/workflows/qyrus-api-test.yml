name: Qyrus API Test Execution

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          cd node-cli
          npm install

      - name: Execute API Tests
        env:
          QYRUS_API_KEY: ${{ secrets.QYRUS_API_KEY }}
        run: |
          cd node-cli
          node ./index.cjs qapi \
            --executionType "functional" \
            --apiKey "$QYRUS_API_KEY" \
            --workspaceName "Demo API" \
            --suiteName "Suite-2" \
            --envName ""
