name: Qyrus Enterprise API Test Execution

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-enterprise-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          cd node-cli
          npm install

      - name: Execute Enterprise API Tests
        env:
          QYRUS_API_KEY: ${{ secrets.QYRUS_API_KEY }}
        run: |
          cd node-cli
          node ./index.cjs web \
            --apiKey "$QYRUS_API_KEY" \
            --teamName "Qyrus Demos" \
            --projectName "Tuba_MCP_Project" \
            --suiteName "Sample_Web_Module" \
            --parameterFileSource "NONE" \
            --browserOS "windows" \
            --browser "Chrome" \
            --onErrorContinue "true" \
            --emailId "tubaq@qyrus.com" \
            --env ""
